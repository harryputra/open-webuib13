services:
  db:
    image: postgres:16-alpine
    container_name: open-webui-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=openwebui_pass
      - POSTGRES_DB=openwebui
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: open-webui-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""

  # SearXNG — meta-search engine self-hosted, FREE UNLIMITED, gak butuh API key.
  # Open WebUI akses lewat http://searxng:8080
  searxng:
    image: searxng/searxng:latest
    container_name: open-webui-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    environment:
      - 'SEARXNG_BASE_URL=http://searxng:8080/'
      - 'INSTANCE_NAME=Antigravity Search'
      - 'UWSGI_WORKERS=2'
      - 'UWSGI_THREADS=4'

  open-webui:
    build: .
    image: openwebui/open-webui:${WEBUI_DOCKER_TAG-latest}
    container_name: open-webui
    env_file:
      - ./.env
    volumes:
      - open-webui:/app/backend/data
      - //var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_DIR:-E:/AntiGravityProject}:/workspace
      - ${RAG_VAULT_PATH:-E:/file_rag}:/file_rag
    ports:
      - ${OPEN_WEBUI_PORT-3013}:8080
    environment:
      # Override .env for container-internal networking (Postgres & Redis pakai service name, bukan localhost)
      - 'DATABASE_URL=postgresql://openwebui:openwebui_pass@db:5432/openwebui'
      - 'REDIS_URL=redis://redis:6379/0'
      - 'WEBSOCKET_REDIS_URL=redis://redis:6379/0'
      - 'OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://host.docker.internal:11434}'
      - 'WORKSPACE_DIR=/workspace'
      - 'WEBUI_NAME=Antigravity Zenith'
      - 'ENABLE_PYODIDE=True'
      - 'ENABLE_ARTIFACTS=True'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - db
      - redis
      - searxng
    restart: unless-stopped

volumes:
  open-webui: {}
  db_data: {}
  searxng_data: {}

