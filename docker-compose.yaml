services:
  db:
    image: postgres:16-alpine
    container_name: open-webui-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=openwebui_pass
      - POSTGRES_DB=openwebui
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: open-webui-redis
    restart: unless-stopped

  open-webui:
    build: .
    image: openwebui/open-webui:${WEBUI_DOCKER_TAG-latest}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
      - //var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_DIR:-E:/AntiGravityProject}:/workspace
      - ${RAG_VAULT_PATH:-E:/file_rag}:/file_rag
    ports:
      - ${OPEN_WEBUI_PORT-3013}:8080
    environment:
      - 'OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://host.docker.internal:11434}'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}'
      - 'DATABASE_URL=postgresql://openwebui:openwebui_pass@db:5432/openwebui'
      - 'REDIS_URL=redis://redis:6379/0'
      - 'ENABLE_PYODIDE=True'
      - 'ENABLE_ARTIFACTS=True'
      - 'ENABLE_RAG_HYBRID_SEARCH=True'
      - 'WEBUI_NAME=Antigravity AI IDE'
      - 'WORKSPACE_DIR=/workspace'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  open-webui: {}
  db_data: {}

