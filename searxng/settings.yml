# SearXNG settings untuk Antigravity Open WebUI
# Generated config — JSON output enabled, search engines free.
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "antigravity-searxng-local-key-ganti-kalau-public"
  base_url: false
  image_proxy: true
  http_protocol_version: "1.0"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_locale: "id"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: dark

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json   # WAJIB untuk Open WebUI integration
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

# Pakai engine yang gratis & gak butuh API key
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: google
    engine: google
    shortcut: go
    use_mobile_ui: false

  - name: bing
    engine: bing
    shortcut: bi

  - name: brave
    engine: brave
    shortcut: br

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    base_url: 'https://{language}.wikipedia.org/'

  - name: github
    engine: github
    shortcut: gh

  - name: stackoverflow
    engine: stackexchange
    shortcut: st
    api_site: 'stackoverflow'
    categories: [it, q&a]

  - name: arxiv
    engine: arxiv
    shortcut: arx
    timeout: 4.0
    categories: [science, scientific publications]
